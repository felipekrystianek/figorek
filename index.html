<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czy będziesz moją Walentynką? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="title">Cześć Kochanie! 💝</h1>
            
            <p class="message">
                Mam dla Ciebie ważne pytanie...
            </p>
            
            <h2 class="question">Czy będziesz moją Walentynką? 🌹</h2>
            
            <div class="buttons">
                <button id="yesBtn" class="btn yes-btn">Tak! 💕</button>
                <button id="noBtn" class="btn no-btn">Nie</button>
            </div>
            
            <div id="response" class="response hidden"></div>
        </div>
        
        <div class="hearts-container">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
